<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Editor - Day 4</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>QuickNotes Editor</h1>
        <button id="theme-toggle">Dark mode</button>
    </header>

    <main>
        <section>
            <label for="note-text">Type your note below:</label><br>
            <textarea id="note-text" rows="8" cols="50" placeholder="Start typing..."></textarea>
            
            <p id="char-count">0 / 200 characters</p>
            <p id="word-count">0 words</p>
            
            <button id="clear-btn">Clear</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes App</p>
    </footer>

</body>
</html>
