<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 1 - QuickNotes App</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <header>
        <h1>QuickNotes Manager</h1>
        <p>Capture and organize your notes effortlessly.</p>
    </header>

    <main>
        <section class="form-container">
            <h2>Add New Note</h2>
            <form id="note-form">
                <div>
                    <label for="note-title">Title:</label><br>
                    <input type="text" id="note-title" required placeholder="Enter title...">
                </div>
                <div>
                    <label for="note-body">Content:</label><br>
                    <textarea id="note-body" rows="4" required placeholder="Write your note here..."></textarea>
                </div>
                <button type="submit" id="add-btn">Add Note</button>
            </form>
        </section>

        <section class="notes-container">
            <h2>My Notes List</h2>
            <ul id="notes-list">
                <!-- Dynamically populated notes will appear here -->
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes App</p>
    </footer>

</body>
</html>
